<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập – ESFAST E-Scooter</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-body">

    <!-- Ambient Glow Orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="auth-page-wrapper">
        <!-- Header -->
        <header class="auth-header-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px;">
            <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
                <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #0052cc, #00d2ff); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 1.15rem;">
                    <i class="fas fa-bolt"></i>
                </div>
                <span style="font-size: 1.35rem; font-weight: 800; color: #ffffff;">ES<span style="color: #00d2ff;">FAST</span></span>
            </a>
            <a href="index.html" style="color: #cbd5e1; font-size: 0.9rem; text-decoration: none; display: flex; align-items: center; gap: 6px;">
                <i class="fas fa-arrow-left"></i> Quay lại trang chủ
            </a>
        </header>

        <!-- Main Card -->
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
            <div class="auth-card" style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; width: 100%; max-width: 460px; padding: 36px 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
                <div style="text-align: center; margin-bottom: 28px;">
                    <h2 style="font-size: 1.85rem; font-weight: 800; color: #ffffff; margin-bottom: 8px;">Đăng Nhập ESFAST</h2>
                    <p style="color: #94a3b8; font-size: 0.9rem;">Chào mừng bạn đến với hệ sinh thái xe máy điện thông minh</p>
                </div>

                <!-- Demo Account Selector Buttons -->
                <div style="background: rgba(0, 82, 204, 0.15); border: 1px dashed rgba(0, 210, 255, 0.4); border-radius: 12px; padding: 14px; margin-bottom: 24px;">
                    <div style="font-size: 0.78rem; text-transform: uppercase; color: #00d2ff; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
                        <i class="fas fa-magic"></i> Tài khoản Demo thử nghiệm nhanh:
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <button type="button" onclick="fillDemoAccount('customer')" style="background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 8px 10px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; text-align: left; transition: all 0.2s;" onmouseover="this.style.borderColor='#00d2ff'" onmouseout="this.style.borderColor='#334155'">
                            <div style="font-weight: 700; color: #38bdf8;"><i class="fas fa-user"></i> Khách hàng</div>
                            <div style="color: #94a3b8; font-size: 0.75rem;">customer / 123456</div>
                        </button>
                        <button type="button" onclick="fillDemoAccount('admin')" style="background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 8px 10px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; text-align: left; transition: all 0.2s;" onmouseover="this.style.borderColor='#ef4444'" onmouseout="this.style.borderColor='#334155'">
                            <div style="font-weight: 700; color: #f87171;"><i class="fas fa-shield-alt"></i> Quản trị viên</div>
                            <div style="color: #94a3b8; font-size: 0.75rem;">admin / admin123</div>
                        </button>
                    </div>
                </div>

                <!-- Error Notice -->
                <div id="loginError" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 18px;"></div>

                <!-- Login Form -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div style="margin-bottom: 18px;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Tài khoản hoặc Email</label>
                        <div style="position: relative;">
                            <i class="fas fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
                            <input type="text" id="loginUsername" name="account" placeholder="Nhập username hoặc email..." required style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 11px 14px 11px 40px; color: #ffffff; font-size: 0.95rem; outline: none; transition: border 0.2s;">
                        </div>
                    </div>

                    <div style="margin-bottom: 22px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <label style="font-size: 0.85rem; font-weight: 600; color: #cbd5e1;">Mật khẩu</label>
                            <a href="javascript:void(0)" onclick="alert('Vui lòng sử dụng tài khoản demo: customer / 123456 hoặc liên hệ hotline!')" style="font-size: 0.8rem; color: #38bdf8; text-decoration: none;">Quên mật khẩu?</a>
                        </div>
                        <div style="position: relative;">
                            <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
                            <input type="password" id="loginPassword" name="password" placeholder="Nhập mật khẩu..." required style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 11px 44px 11px 40px; color: #ffffff; font-size: 0.95rem; outline: none; transition: border 0.2s;">
                            <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; background: linear-gradient(135deg, #0052cc, #00d2ff); color: #ffffff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 16px rgba(0,82,204,0.4);">
                        <i class="fas fa-sign-in-alt"></i> Đăng Nhập
                    </button>
                </form>

                <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: #94a3b8;">
                    Chưa có tài khoản? <a href="register.html" style="color: #00d2ff; font-weight: 700; text-decoration: none;">Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
