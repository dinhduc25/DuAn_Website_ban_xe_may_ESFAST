<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Khách Hàng – ESFAST E-Scooter</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <!-- MAIN HEADER -->
    <header style="background: #ffffff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 999;">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between; height: 74px; gap: 20px;">
            <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
                <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #0052cc, #00d2ff); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 1.3rem;">
                    <i class="fas fa-bolt"></i>
                </div>
                <div>
                    <span style="font-size: 1.45rem; font-weight: 800; color: #0f172a;">ES<span style="color: #0052cc;">FAST</span></span>
                    <span style="display: block; font-size: 0.65rem; color: #64748b; font-weight: 600; text-transform: uppercase;">Electric Vehicle</span>
                </div>
            </a>

            <nav class="header-nav" style="display: flex; align-items: center; gap: 22px;">
                <a href="index.html" class="nav-link" style="font-weight: 600; color: #334155;"><i class="fas fa-home"></i> Trang Chủ</a>
                <a href="products.html" class="nav-link" style="font-weight: 600; color: #334155;"><i class="fas fa-motorcycle"></i> Xe Máy Điện</a>
                <a href="orders.html" class="nav-link" style="font-weight: 600; color: #334155;"><i class="fas fa-box"></i> Đơn Đã Mua</a>
            </nav>

            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="cart.html" style="position: relative; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; background: #f1f5f9; color: #0f172a; text-decoration: none;">
                    <i class="fas fa-shopping-cart" style="font-size: 1.15rem;"></i>
                    <span class="cart-count-badge" style="position: absolute; top: -4px; right: -4px; background: #ef4444; color: #ffffff; font-size: 0.72rem; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: none; align-items: center; justify-content: center;">0</span>
                </a>
                <div id="headerAuthContainer"></div>
                <button id="mobileMenuToggle" class="mobile-menu-btn" style="display: none; background: none; border: none; font-size: 1.4rem; color: #0f172a; cursor: pointer; padding: 4px;">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- BREADCRUMB -->
    <div style="background: #f1f5f9; padding: 14px 0; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem;">
        <div class="container" style="display: flex; align-items: center; gap: 8px; color: #64748b;">
            <a href="index.html" style="color: #64748b; text-decoration: none;">Trang chủ</a>
            <span>/</span>
            <span style="color: #0052cc; font-weight: 600;">Tài khoản của tôi</span>
        </div>
    </div>

    <!-- MAIN ACCOUNT CONTENT -->
    <main style="padding: 40px 0 80px; background: #f8fafc;">
        <div class="container">
            <div class="account-layout" style="display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: flex-start;">
                
                <!-- Sidebar Nav -->
                <div style="background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
                    <!-- User Avatar & Tag -->
                    <div style="text-align: center; padding-bottom: 20px; border-bottom: 1px solid #f1f5f9; margin-bottom: 20px;">
                        <div style="width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #0052cc, #00d2ff); color: #ffffff; font-size: 2rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
                            <i class="fas fa-user"></i>
                        </div>
                        <h3 id="accWelcomeName" style="font-size: 1.15rem; font-weight: 800; color: #0f172a; margin-bottom: 4px;">...</h3>
                        <span id="accRoleBadge" style="display: inline-block; background: #eff6ff; color: #0052cc; font-size: 0.75rem; font-weight: 700; padding: 3px 12px; border-radius: 999px;">...</span>
                    </div>

                    <!-- Menu links -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <a href="#profileSection" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; background: #eff6ff; color: #0052cc; font-weight: 700; text-decoration: none;">
                            <i class="fas fa-user-edit"></i> Thông tin cá nhân
                        </a>
                        <a href="orders.html" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 8px; color: #334155; font-weight: 600; text-decoration: none;">
                            <span style="display: flex; align-items: center; gap: 10px;"><i class="fas fa-box"></i> Đơn mua xe</span>
                            <span id="accOrderCount" style="background: #f1f5f9; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; color: #64748b;">0 đơn</span>
                        </a>
                        <a href="#passwordSection" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; color: #334155; font-weight: 600; text-decoration: none;">
                            <i class="fas fa-key"></i> Đổi mật khẩu
                        </a>
                        <a href="javascript:void(0)" onclick="handleAccountLogout()" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; color: #ef4444; font-weight: 600; text-decoration: none; border-top: 1px solid #f1f5f9; margin-top: 10px;">
                            <i class="fas fa-sign-out-alt"></i> Đăng xuất
                        </a>
                    </div>
                </div>

                <!-- Right: Forms -->
                <div>
                    <!-- Form 1: Edit Profile -->
                    <div id="profileSection" style="background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 32px; margin-bottom: 28px; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
                        <h3 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                            <i class="fas fa-id-card text-primary"></i> Chỉnh Sửa Thông Tin Cá Nhân
                        </h3>

                        <form onsubmit="handleUpdateProfile(event)">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Họ và tên *</label>
                                    <input type="text" id="accFullName" name="fullName" required style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 0.95rem;">
                                </div>
                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Tên đăng nhập (Cố định)</label>
                                    <input type="text" id="accUsername" name="username" readonly style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; color: #64748b; font-size: 0.95rem; cursor: not-allowed;">
                                </div>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Email nhận thông báo *</label>
                                    <input type="email" id="accEmail" name="email" required style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 0.95rem;">
                                </div>
                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Số điện thoại *</label>
                                    <input type="tel" id="accPhone" name="phone" required style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 0.95rem;">
                                </div>
                            </div>

                            <div style="margin-bottom: 24px;">
                                <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Địa chỉ mặc định</label>
                                <input type="text" id="accAddress" name="address" placeholder="Nhập địa chỉ nhà..." style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 0.95rem;">
                            </div>

                            <button type="submit" class="btn btn-primary" style="padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer;">
                                <i class="fas fa-save"></i> Lưu Thay Đổi
                            </button>
                        </form>
                    </div>

                    <!-- Form 2: Change Password -->
                    <div id="passwordSection" style="background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 32px; box-shadow: 0 4px 14px rgba(0,0,0,0.03);">
                        <h3 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                            <i class="fas fa-lock text-primary"></i> Đổi Mật Khẩu
                        </h3>

                        <form onsubmit="handleChangePassword(event)">
                            <div style="margin-bottom: 16px;">
                                <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Mật khẩu hiện tại *</label>
                                <input type="password" name="currentPassword" required placeholder="Nhập mật khẩu cũ..." style="width: 100%; max-width: 400px; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 0.95rem;">
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; max-width: 600px;">
                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Mật khẩu mới *</label>
                                    <input type="password" name="newPassword" required placeholder="Tối thiểu 6 ký tự" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 0.95rem;">
                                </div>
                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Nhập lại mật khẩu mới *</label>
                                    <input type="password" name="confirmNewPassword" required placeholder="Khớp mật khẩu mới" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 0.95rem;">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-outline" style="padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer;">
                                <i class="fas fa-shield-alt"></i> Cập Nhật Mật Khẩu
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer style="background: #0f172a; color: #cbd5e1; padding: 60px 0 24px; font-size: 0.9rem; border-top: 1px solid rgba(255,255,255,0.08);">
        <div class="container">
            <div style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 0.82rem; color: #64748b;">
                <p>© 2026 ESFAST E-Scooter Vietnam. All rights reserved.</p>
                <p><a href="index.html" style="color: #00d2ff; text-decoration: none;">Trang chủ</a> | <a href="orders.html" style="color: #00d2ff; text-decoration: none;">Đơn hàng</a></p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/account.js"></script>
</body>
</html>
