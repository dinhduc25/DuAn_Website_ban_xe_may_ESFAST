<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản – ESFAST E-Scooter</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-body">

    <!-- Ambient Glow Orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="auth-page-wrapper">
        <!-- Header -->
        <header class="auth-header-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px;">
            <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
                <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #0052cc, #00d2ff); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 1.15rem;">
                    <i class="fas fa-bolt"></i>
                </div>
                <span style="font-size: 1.35rem; font-weight: 800; color: #ffffff;">ES<span style="color: #00d2ff;">FAST</span></span>
            </a>
            <a href="login.html" style="color: #cbd5e1; font-size: 0.9rem; text-decoration: none; display: flex; align-items: center; gap: 6px;">
                Đã có tài khoản? <strong style="color: #00d2ff;">Đăng nhập</strong>
            </a>
        </header>

        <!-- Main Form Card -->
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 20px 40px;">
            <div class="auth-card" style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; width: 100%; max-width: 520px; padding: 36px 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
                <div style="text-align: center; margin-bottom: 24px;">
                    <h2 style="font-size: 1.85rem; font-weight: 800; color: #ffffff; margin-bottom: 8px;">Tạo Tài Khoản ESFAST</h2>
                    <p style="color: #94a3b8; font-size: 0.9rem;">Trở thành thành viên để nhận ưu đãi và bảo dưỡng xe đặc quyền</p>
                </div>

                <!-- Error Notice -->
                <div id="registerError" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 18px;"></div>

                <!-- Register Form -->
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div style="margin-bottom: 14px;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Họ và tên của bạn</label>
                        <div style="position: relative;">
                            <i class="fas fa-id-card" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
                            <input type="text" name="fullName" placeholder="Ví dụ: Nguyễn Văn A" required style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px 10px 40px; color: #ffffff; font-size: 0.95rem; outline: none;">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
                        <div>
                            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Tên đăng nhập</label>
                            <input type="text" name="username" placeholder="vi_du_123" required style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; color: #ffffff; font-size: 0.95rem; outline: none;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Số điện thoại</label>
                            <input type="tel" name="phone" placeholder="0987xxxxxx" required style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; color: #ffffff; font-size: 0.95rem; outline: none;">
                        </div>
                    </div>

                    <div style="margin-bottom: 14px;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Địa chỉ Email</label>
                        <div style="position: relative;">
                            <i class="fas fa-envelope" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
                            <input type="email" name="email" placeholder="email@example.com" required style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px 10px 40px; color: #ffffff; font-size: 0.95rem; outline: none;">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px;">
                        <div>
                            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Mật khẩu</label>
                            <input type="password" name="password" placeholder="Tối thiểu 6 ký tự" required style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; color: #ffffff; font-size: 0.95rem; outline: none;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">Nhập lại mật khẩu</label>
                            <input type="password" name="confirmPassword" placeholder="Nhập lại đúng mật khẩu" required style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; color: #ffffff; font-size: 0.95rem; outline: none;">
                        </div>
                    </div>

                    <div style="margin-bottom: 22px; display: flex; align-items: flex-start; gap: 8px;">
                        <input type="checkbox" name="terms" id="agreeTerms" required style="margin-top: 4px; accent-color: #0052cc;">
                        <label for="agreeTerms" style="font-size: 0.82rem; color: #94a3b8; line-height: 1.4;">
                            Tôi đồng ý với <a href="javascript:void(0)" onclick="alert('Điều khoản dịch vụ bảo dưỡng & mua bán xe máy điện ESFAST')" style="color: #38bdf8;">Điều khoản dịch vụ</a> và <a href="javascript:void(0)" onclick="alert('Chính sách bảo mật thông tin cá nhân ESFAST')" style="color: #38bdf8;">Chính sách bảo mật</a> của ESFAST.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; background: linear-gradient(135deg, #0052cc, #00d2ff); color: #ffffff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 16px rgba(0,82,204,0.4);">
                        <i class="fas fa-user-plus"></i> Đăng Ký Tài Khoản
                    </button>
                </form>

                <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: #94a3b8;">
                    Đã có tài khoản? <a href="login.html" style="color: #00d2ff; font-weight: 700; text-decoration: none;">Đăng nhập ngay</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
